{% extends "base.html" %}
{% block title %}Contas — Postagem IG{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Contas Instagram</h1>
    <p class="subtitle">Gerencie tokens, proxy e conta de contingência — sem limite de contas</p>
  </div>
</div>

<div class="grid-2">
  <section class="card glass glow">
    <h2 id="form-title">Nova conta</h2>
    <form id="account-form" onsubmit="saveAccount(event)">
      <input type="hidden" id="account-id">
      <label class="field-label">Nome interno<input id="name" required></label>
      <label class="field-label">IG User ID<input id="ig_user_id" required></label>
      <label class="field-label">Access Token<textarea id="access_token" rows="3" required></textarea></label>
      <label class="field-label">Proxy<input id="proxy_url" placeholder="http://user:pass@host:port"></label>
      <label class="field-label">Username<input id="username"></label>
      <label class="field-label">Conta de contingência
        <select id="fallback_account_id">
          <option value="">Nenhuma</option>
        </select>
        <span class="hint">Usada automaticamente se esta conta cair ou falhar</span>
      </label>
      <div class="row">
        <label class="field-label">Max/dia<input type="number" id="max_posts_per_day" value="100" min="1" max="500"></label>
        <label class="field-label">Max/hora<input type="number" id="max_posts_per_hour" value="25" min="1" max="100"></label>
      </div>
      <label class="checkbox"><input type="checkbox" id="is_active" checked> Conta ativa</label>
      <div class="actions">
        <button type="submit" class="btn primary">Salvar</button>
        <button type="button" class="btn secondary" onclick="resetAccountForm()">Limpar</button>
      </div>
    </form>
  </section>

  <section class="card glass glow">
    <h2>Contas cadastradas</h2>
    <div id="accounts-list"></div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>initAccountsPage();</script>
{% endblock %}
