<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Postagem IG{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20260824-dash1">
</head>
<body class="shell-v2">
  <div class="app-bg"></div>
  <aside class="sidebar sidebar--rail" aria-label="Navegação">
    <a href="/" class="rail-brand" title="Postagem IG">
      <img src="/static/logo-ghost.svg" alt="Postagem IG" width="36" height="36">
    </a>
    <nav class="rail-nav">
      <a href="/" class="rail-link {% if page == 'dashboard' %}active{% endif %}" title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </a>
      <a href="/accounts" class="rail-link {% if page == 'accounts' %}active{% endif %}" title="Contas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </a>
      <a href="/loop" class="rail-link rail-link--hot {% if page == 'loop' %}active{% endif %}" title="Reels em lote">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </a>
      <a href="/publish" class="rail-link {% if page == 'publish' %}active{% endif %}" title="Publicar 1×">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </a>
      <a href="/schedule" class="rail-link {% if page == 'schedule' %}active{% endif %}" title="Agendamentos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </a>
      <a href="/media" class="rail-link {% if page == 'media' %}active{% endif %}" title="Mídia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </a>
      <a href="/contingency" class="rail-link {% if page == 'contingency' %}active{% endif %}" title="Contingência">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </a>
      <a href="/users" class="rail-link {% if page == 'users' %}active{% endif %}" id="nav-users" title="Usuários">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </a>
      <a href="/settings" class="rail-link {% if page == 'settings' %}active{% endif %}" id="nav-settings" title="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </a>
    </nav>
    <button class="rail-link rail-logout" onclick="doLogout()" title="Sair" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </aside>
  <div class="shell-main">
    <header class="topbar">
      <div class="topbar-greeting">
        <h1 id="topbar-hello">Olá</h1>
        <p id="topbar-date" class="topbar-date"></p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" title="Atualizar" onclick="typeof refreshAllInsights==='function'&&refreshAllInsights()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <div class="topbar-user" id="topbar-user">
          <span class="topbar-avatar" id="topbar-avatar">P</span>
        </div>
      </div>
    </header>
    <main class="content content--rail">
      <div id="global-db-banner" class="hidden notice" style="margin-bottom:20px"></div>
      {% block content %}{% endblock %}
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/bg.js?v=20260824-dash1"></script>
  <script src="/static/app.js?v=20260824-dash1"></script>
  <script>
    (function initTopbar() {
      const h = new Date().getHours();
      const saud = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
      const dateEl = document.getElementById("topbar-date");
      if (dateEl) {
        dateEl.textContent = new Date().toLocaleDateString("pt-BR", {
          day: "2-digit", month: "long", year: "numeric"
        }).toUpperCase();
      }
      api("/api/me").then(me => {
        const name = me.username || "admin";
        const hello = document.getElementById("topbar-hello");
        if (hello) hello.textContent = `${saud}, ${name}`;
        const av = document.getElementById("topbar-avatar");
        if (av) av.textContent = (name[0] || "P").toUpperCase();
        if (me.role !== "owner") {
          document.getElementById("nav-users")?.classList.add("hidden");
          document.getElementById("nav-settings")?.classList.add("hidden");
        }
      }).catch(() => {
        const hello = document.getElementById("topbar-hello");
        if (hello) hello.textContent = saud;
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
