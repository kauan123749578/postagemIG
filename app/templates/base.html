<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Postagem IG{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20250626-ig">
</head>
<body>
  <div class="app-bg"></div>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-mark sm">
        <img src="/static/logo.svg" alt="Postagem IG" class="brand-logo">
      </div>
      <div>
        <div class="brand-title">Postagem IG</div>
        <div class="brand-sub">API Meta</div>
      </div>
    </div>
    <nav>
      <a href="/" class="nav-link {% if page == 'dashboard' %}active{% endif %}"><span class="nav-dot"></span>Dashboard</a>
      <a href="/publish" class="nav-link {% if page == 'publish' %}active{% endif %}"><span class="nav-dot"></span>Publicar</a>
      <a href="/schedule" class="nav-link {% if page == 'schedule' %}active{% endif %}"><span class="nav-dot"></span>Agendamentos</a>
      <a href="/media" class="nav-link {% if page == 'media' %}active{% endif %}"><span class="nav-dot"></span>Mídia</a>
      <a href="/accounts" class="nav-link {% if page == 'accounts' %}active{% endif %}"><span class="nav-dot"></span>Contas</a>
      <a href="/contingency" class="nav-link {% if page == 'contingency' %}active{% endif %}"><span class="nav-dot"></span>Contingência</a>
      <a href="/loop" class="nav-link {% if page == 'loop' %}active{% endif %}"><span class="nav-dot"></span>Loop</a>
      <a href="/users" class="nav-link {% if page == 'users' %}active{% endif %}" id="nav-users"><span class="nav-dot"></span>Usuários</a>
      <a href="/settings" class="nav-link {% if page == 'settings' %}active{% endif %}" id="nav-settings"><span class="nav-dot"></span>Configurações</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost btn-full" onclick="doLogout()">Sair</button>
    </div>
  </aside>
  <main class="content">
    <div id="global-db-banner" class="hidden notice" style="margin-bottom:20px"></div>
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/bg.js?v=20250626-ig"></script>
  <script src="/static/app.js?v=20250626-ig"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
